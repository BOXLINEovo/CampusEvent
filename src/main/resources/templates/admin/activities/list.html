<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>活动管理 - CampusEvent</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<nav>
    <a href="/">首页</a>
    <a href="/activities">学生活动列表</a>
    <a href="/admin/approvals">待审核</a>
    <a href="/admin/statistics">统计</a>
</nav>

<h1>活动管理</h1>
<div class="msg ok" th:if="${message}" th:text="${message}"></div>
<div class="msg err" th:if="${error}" th:text="${error}"></div>
<div class="actions">
    <a class="btn" href="/admin/activities/new">新建活动</a>
</div>

<div class="table-wrap">
    <table>
        <thead>
        <tr>
            <th>名称</th>
            <th>类型</th>
            <th>开始时间</th>
            <th>容量</th>
            <th>已通过</th>
            <th>待审核</th>
            <th>报名方式</th>
            <th>操作</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="view : ${activities}">
            <td th:text="${view.activity.title}"></td>
            <td th:text="${view.activity.category}"></td>
            <td th:text="${view.activity.startAt}"></td>
            <td th:text="${view.activity.capacity}"></td>
            <td th:text="${view.statistics != null ? view.statistics.approvedCount : 0}"></td>
            <td th:text="${view.statistics != null ? view.statistics.pendingCount : 0}"></td>
            <td th:text="${view.activity.policyType}"></td>
            <td>
                <div class="actions">
                    <a class="btn btn-secondary" th:href="@{/admin/activities/{id}/edit(id=${view.activity.activityId})}">编辑</a>
                    <form class="inline" th:action="@{/admin/activities/{id}/delete(id=${view.activity.activityId})}"
                          method="post" onsubmit="return confirm('确认删除该活动？')">
                        <button class="btn-danger" type="submit">删除</button>
                    </form>
                </div>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(activities)}">
            <td colspan="8" class="muted">暂无活动</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>

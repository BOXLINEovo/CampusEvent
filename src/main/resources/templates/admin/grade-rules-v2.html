<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>年级规则 - CampusEvent</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<nav>
    <a href="/">首页</a>
    <a href="/activities">活动列表</a>
    <a href="/admin/grade-rules-v2">年级规则</a>
    <a href="/admin/emails-v2">模拟邮件</a>
    <a href="/grade-demo-v2">年级报名演示</a>
</nav>

<h1>年级限定规则</h1>

<div class="msg ok" th:if="${message}" th:text="${message}"></div>
<div class="msg err" th:if="${error}" th:text="${error}"></div>

<div class="table-wrap">
    <table>
        <thead>
        <tr>
            <th>活动</th>
            <th>报名方式</th>
            <th>年级范围</th>
            <th>操作</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="row : ${rows}">
            <td th:text="${row.activity.title}"></td>
            <td th:text="${row.activity.policyType}"></td>
            <td th:if="${row.rule != null}"
                th:text="${row.rule.minGrade + '—' + row.rule.maxGrade}"></td>
            <td th:if="${row.rule == null}">未配置</td>
            <td>
                <form class="inline" th:if="${row.activity.policyType.name() == 'DIRECT'}"
                      th:action="@{/admin/grade-rules-v2}" method="post">
                    <input type="hidden" name="activityId" th:value="${row.activity.activityId}">
                    <input type="number" name="minGrade" min="1" max="4"
                           th:value="${row.rule != null ? row.rule.minGrade : 2}" required>
                    <input type="number" name="maxGrade" min="1" max="4"
                           th:value="${row.rule != null ? row.rule.maxGrade : 3}" required>
                    <button type="submit">保存</button>
                </form>
                <span class="muted" th:if="${row.activity.policyType.name() != 'DIRECT'}">仅直接报名活动可配置</span>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<p class="muted">规则范围使用 1—4，分别对应大一至大四；已有有效报名的活动保持原年级范围。</p>
<p><a href="/activities">返回活动列表</a></p>
</body>
</html>

spring:
  application:
    name: campus-event

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/campusevent}
    username: ${DB_USER:campusevent}
    password: ${DB_PASSWORD:campusevent}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  thymeleaf:
    cache: false

server:
  port: ${PORT:8080}

logging:
  level:
    root: INFO
    com.campusevent: INFO
